name = "latte-app"
main = "src/main/worker/index.js"
compatibility_date = "2026-05-01"

# Enable Workers Observability so Worker + Durable Object + container logs are retained and viewable
# in the dashboard (Workers & Pages -> latte-app -> Logs) and via `npx wrangler tail latte-app`.
[observability]
enabled = true

# Publicly serve the app at app.lattejava.org. Requires the lattejava.org zone to be active in
# this Cloudflare account (it is); wrangler provisions the edge cert + DNS record on deploy.
[[routes]]
pattern = "app.lattejava.org"
custom_domain = true

# Also serve the token-authenticated JSON API at api.lattejava.org. A Worker custom domain routes by
# exact hostname, so a bare DNS record for api.* yields a 522 (CF finds no Worker route and tries a
# non-existent origin). Binding it as a custom domain here routes it to the same container; wrangler
# provisions the edge cert + DNS record on deploy (delete any manual api.* DNS record first).
[[routes]]
pattern = "api.lattejava.org"
custom_domain = true

# The JVM app runs in this container (built from ./Dockerfile -> the `latte bundle` output).
# A single instance is enough for this app; bump instance_type to standard-2 if cold-start CPU
# (JVM boot + JTE template compilation) proves too slow.
[[containers]]
class_name = "LatteApp"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 1

[[durable_objects.bindings]]
name = "LATTE_APP"
class_name = "LatteApp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LatteApp"]

# Non-secret app configuration injected into the container (see src/main/worker/index.js). Secrets
# (DB_PASSWORD, FUSIONAUTH_APIKEY, *_CLIENTSECRET, S3_SECRETACCESSKEY, WEB_COOKIEENCRYPTIONKEY) are
# set out-of-band with `wrangler secret put` and are intentionally NOT committed here.
# DB_URL points at PlanetScale's Dedicated Primary PgBouncer on port 6432 (transaction-pooling mode,
# so prepareThreshold=0 disables server-side prepared statements); fill in the real host/database/user.
[vars]
FUSIONAUTH_BASEURL = "https://auth.lattejava.org"
FUSIONAUTH_ISSUER = "https://auth.lattejava.org"
S3_REGION = "auto"
S3_ENDPOINT = "https://fc7ca59f9d7571dfd8bce1c3edfd4f0a.r2.cloudflarestorage.com"
S3_BUCKET = "latte-repository"
DB_URL = "jdbc:postgresql://us-east-4.pg.psdb.cloud:6432/postgres?sslmode=require&prepareThreshold=0"
DB_USERNAME = "pscale_api_ocmtmgeqkgek.fwug00playvr"
FUSIONAUTH_CLIENTID = "e9fdb985-9173-4e01-9d73-ac2d60d1dc8e"
FUSIONAUTH_CLICLIENTID = "cc5f3c9e-b28e-4632-bafe-823363669820"
GITHUB_CLIENTID = "Ov23lizxeTxZaPWqEIXY"
